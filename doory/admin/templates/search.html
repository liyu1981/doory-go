{{define "content"}}
<h1>Search</h1>
<form method="get" class="searchbar"><input type="search" name="q" value="{{.Query}}"><button type="submit">Search</button></form>
{{if .Results}}
<h2>Results</h2>
<ul>{{range .Results}}<li><a href="{{.URL}}">{{.Model}}: {{.Title}}</a></li>{{end}}</ul>
{{else}}{{if .Query}}<p>No results found.</p>{{end}}{{end}}
{{end}}
