{{define "content"}}
<h1>{{.Title}}</h1>
<p>Are you sure you want to delete the selected {{.ObjectName}}?</p>
{{if .Objects}}
<h2>Objects</h2>
<ul>
{{range .Objects}}<li>{{.Repr}}</li>{{end}}
</ul>
{{end}}
<form method="post">
<input type="hidden" name="csrfmiddlewaretoken" value="{{.CSRFToken}}">
{{range .Objects}}<input type="hidden" name="_selected_action" value="{{.ID}}">{{end}}
<input type="hidden" name="action" value="delete_selected">
<input type="hidden" name="post" value="yes">
<div class="actions"><button type="submit" name="post" value="yes">Yes, I’m sure</button><a class="button secondary" href="{{.BackURL}}">No, take me back</a></div>
</form>
{{end}}
