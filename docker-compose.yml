# The Doory single binary (this port, D1): one service serves the API, the
# realtime WebSockets, MCP and the embedded frontend on port 8080. It replaces
# upstream's api + realtime + mcp + web (nginx) services; PostgreSQL stays
# optional (D4: without DATABASE_URL the container keeps SQLite under its data
# volume).
#
#   cp .env.example .env    # set DJANGO_SECRET_KEY and SITE_URL
#   docker compose up -d --build
#
# The site is published on http://localhost:${WEB_PORT:-8080}.
name: doory
services:
  doory:
    build:
      context: .
      args:
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-true}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      CSRF_TRUSTED_ORIGINS: ${SITE_URL}
      # Uncomment to use the bundled PostgreSQL instead of the SQLite default:
      # DATABASE_URL: postgres://${POSTGRES_USER:-doory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-doory}
      DATABASE_URL: ${DATABASE_URL:-}
      MCP_ENABLED: "true"
      # Optional catalog bootstraps on first start (they download; see docker-entrypoint).
      DOORY_SEED_TEMPLATES: ${DOORY_SEED_TEMPLATES:-true}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    volumes:
      # The data directory holds the SQLite database, media and exports (D4).
      - doorydata:/app/data
    security_opt:
      - no-new-privileges:true
    # Chromium (server-side PDF export) needs more shared memory than Docker's 64 MB default.
    shm_size: "512m"
    healthcheck:
      test: ["/app/doory", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Optional PostgreSQL (D4): use it by setting DATABASE_URL above and starting
  # this profile: docker compose --profile postgres up -d
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doory}
      POSTGRES_USER: ${POSTGRES_USER:-doory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  doorydata:
  pgdata:
