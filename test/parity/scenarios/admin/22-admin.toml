# Behavior family: admin (D2, G27-G31).
#
# The Go admin is server-rendered without django-unfold, so page markup is a
# recorded difference (D2) and every HTML page step compares status + headers
# only. Redirects, Set-Cookie shapes, Vary/Allow and the resulting database
# rows are compared exactly.
name = "22-admin"
description = "Admin pages match the oracle's status/redirect/header/state semantics: bootstrap, login, index, changelists, add/change pages, actions and uploads."
driver = "http"
tags = []
collectstatic = true
dialects = ["sqlite"]
# Thumbnails are derived images: the WebP encoder now matches Pillow, but the
# resampling filter (CatmullRom vs Lanczos) still changes pixels, so files in
# these directories compare by decoded dimensions instead of bytes (D15).
media_structural = ["templates/", "elements/packs/"]
covers = [
  "backend/apps/accounts/admin.py",
  "backend/apps/ai/admin.py",
  "backend/apps/apitokens/admin.py",
  "backend/apps/assets/admin.py",
  "backend/apps/brand/admin.py",
  "backend/apps/designs/admin.py",
  "backend/apps/elements/admin.py",
  "backend/apps/fonts/admin.py",
  "backend/apps/gallery/admin.py",
  "backend/apps/presets/admin.py",
  "backend/apps/sharing/admin.py",
  "backend/doory/urls.py",
]

[env]
DJANGO_SECRET_KEY = "parity-oracle-secret-key-0123456789"
SECURE_COOKIES = "false"
DJANGO_SUPERUSER_PASSWORD = "root-pass-12345"

# Bootstrap: both sides seed the same superuser row.
[[steps]]
command = "createsuperuser"
args = ["--noinput", "--email", "root@example.com"]

# Content the admin pages list: gallery templates + categories, size presets
# and the built-in element packs (all deterministic, compared row by row).
[[steps]]
command = "seed_gallery"

[[steps]]
command = "seed_size_presets"

[[steps]]
command = "seed_elements"

# Anonymous admin pages: login form, then the staff gate on the index.
[[steps]]
method = "GET"
path = "/admin/login/"
headers_only = true

[[steps]]
method = "GET"
path = "/admin/"

# Login with the CSRF token from the login page cookie.
headers_only = true
[[steps]]
method = "POST"
path = "/admin/login/"
headers = { Content-Type = "application/x-www-form-urlencoded", X-CSRFToken = "{{cookie:csrftoken}}" }
body = "username=root%40example.com&password=root-pass-12345&next=%2Fadmin%2F"
headers_only = true

