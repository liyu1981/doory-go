# Behavior family: collab (family 15, PLAN.md M11) — collab guard rails:
# the designs PATCH realtime guard (409 use_realtime) + staff-only stats.
#
# Probe lineage: probes/0014-collab-share (L7 handshake refusal, live rooms)
# and the live stats check recorded in the M11 log: the endpoint is behind
# IsAdminUser, so a non-staff session answers 403 permission_denied and no
# session at all answers 401 (DRF default permission denial order). The 200
# body carries per-process heartbeat timestamps and instance ids, so the
# staff-200 shape is asserted structurally by the endpoint's own unit port
# rather than byte-compared here.

name = "18-collab-guard"
description = "Realtime collab guard: designs PATCH realtime 409 with a live room + staff-only stats."
driver = "http"
family = "collab"
tags = []
dialects = ["sqlite"]
covers = [
  "backend/apps/collab/middleware.py",
  "backend/apps/collab/views.py",
]

[env]
DJANGO_SECRET_KEY = "parity-oracle-secret-key-0123456789"
SECURE_COOKIES = "false"
REALTIME_ENABLED = "true"

[[steps]]
method = "GET"
path = "/api/v1/auth/csrf/"

[[steps]]
method = "POST"
path = "/api/v1/auth/register/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"email":"collab18@example.com","password":"Tr0ub4dor&3xkcd9"}'

[[steps]]
method = "POST"
path = "/api/v1/designs/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"title":"Collab Guard"}'
capture = { did = "\"id\":\"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\"" }

[[steps]]
method = "GET"
path = "/api/v1/designs/{{capture:did}}/"

[[steps]]
ws = { action = "connect", design_id = "{{capture:did}}", expect = "ready", close_code = 0, close_reason = "" }

# stats is staff-only: the live room above does not change the permission answer.
[[steps]]
method = "GET"
path = "/api/v1/collab/stats/"

# no session at all: DRF denies before the staff check (401).
[[steps]]
method = "GET"
path = "/api/v1/collab/stats/"
jar = "anon"

[[steps]]
method = "PATCH"
path = "/api/v1/designs/{{capture:did}}/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"document":{"schemaVersion":1,"width":10,"height":10,"pages":[{"id":"p","objects":[]}]},"base_revision":99}'
