# Behavior family: collab (family 15, PLAN.md M11) — collab guard rails:
# the designs PATCH realtime guard (409 use_realtime) and the staff-only
# collab stats endpoint, via the http driver.

name = "18-collab-guard"
description = "Realtime collab guards: designs PATCH realtime 409 + staff-only collab stats."
driver = "http"
family = "collab"
tags = []
dialects = ["sqlite"]
covers = [
  "backend/apps/collab/views.py",
]

[env]
DJANGO_SECRET_KEY = "parity-oracle-secret-key-0123456789"
SECURE_COOKIES = "false"
REALTIME_ENABLED = "true"

[[steps]]
method = "GET"
path = "/api/v1/auth/csrf/"

[[steps]]
method = "POST"
path = "/api/v1/auth/register/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"email":"collab18@example.com","password":"Tr0ub4dor&3xkcd9"}'

[[steps]]
method = "POST"
path = "/api/v1/designs/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"title":"Collab Guard"}'
capture = { did = "\"id\":\"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\"" }

[[steps]]
method = "PATCH"
path = "/api/v1/designs/{{capture:did}}/0/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"document":{"schemaVersion":1,"width":10,"height":10,"pages":[{"id":"p","objects":[]}]},"base_revision":99}'
