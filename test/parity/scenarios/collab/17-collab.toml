# Behavior family: collab (family 15, PLAN.md M11) — realtime WS runtime:
# owner handshake (ready + welcome sync), ping/pong, CRDT roundtrip, and the
# close-code contract, via the runner's ws step driver.
#
# Probe lineage:
#   probes/0012-collab (oracle WS via uvicorn doory.asgi):
#     phase A owner ready{type,role,canWrite,user,title,revision,limits} ->
#       binary sync/step1 (13B state-vector request); text ping -> pong;
#       client sync/step1 -> server sync/step2 (345B full-state update);
#       clean local close.
#     phase B no-session -> accept then close 4401 not_authenticated;
#       foreign Origin -> handshake refused HTTP403.
#     phase C unknown text frame -> close 4400 bad_frame; unknown binary
#       message type -> close 4400 bad_frame.
#   probes/0014-collab-share: pending (non-owner) connection -> close 4408
#     auth_timeout; trashed design (owner) -> close 4404 design_trashed;
#     oversize frame -> close 4413 frame_too_large; message rate -> close
#     4429 rate_limited; client sync/step1 -> sync/step2 document.
#
# The route is the ORACLE's bare /ws/designs/<uuid>/ (the /api/v1 prefix is
# the API namespace; Django's URL resolver answers handler404 on the API path
# — probe0012 + ledger routes-v2…). The Go side registers the same shape and
# dials with the session cookie (jar lookups go through the http:// form: a
# ws:// URL returns no cookies from Go's cookiejar).
#
# Per-side capture: each side dials the design id IT created; the shared
# variable map would otherwise hand the oracle's id to the Go server (no such
# design -> auth timer -> 4408 instead of ready).

name = "17-collab"
description = "Realtime collab owner WS: connect/ready/welcome sync, ping-pong, CRDT roundtrip, bad frames, auth timeout + clean close."
driver = "ws"
family = "collab"
tags = []
dialects = ["sqlite"]
covers = [
  "backend/apps/collab/consumers.py",
  "backend/apps/collab/routing.py",
  "backend/apps/collab/access.py",
  "backend/apps/collab/limits.py",
  "backend/apps/collab/protocol.py",
]

[env]
DJANGO_SECRET_KEY = "parity-oracle-secret-key-0123456789"
SECURE_COOKIES = "false"
REALTIME_ENABLED = "true"
REALTIME_AUTH_TIMEOUT_SECONDS = "2"

[[steps]]
method = "GET"
path = "/api/v1/auth/csrf/"

[[steps]]
method = "POST"
path = "/api/v1/auth/register/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"email":"collab@example.com","password":"Tr0ub4dor&3xkcd9"}'

[[steps]]
method = "POST"
path = "/api/v1/designs/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"title":"Collab WS"}'
capture = { did = "\"id\":\"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\"" }

# ---- owner handshake, ping/pong, CRDT roundtrip (probe0012 phase A) ----
# The ready frame is followed by the welcome sync/step1; a client sync/step1
# (empty state vector) is answered with sync/step2, whose update must decode
# to the SAME document on both sides (page uuids normalized).
[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", expect = "ready", expect_role = "owner", expect_can_write = true, expect_binary_kind = "sync/step1", send = '{"type":"ping"}', expect_after = "pong", close_code = 1000, close_reason = "bye" }

[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", expect = "ready", expect_binary_kind = "sync/step1", send = "00000100", expect_after_binary = "sync/step2", expect_after_document = "sync/step2", close_code = 1000, close_reason = "bye" }

# ---- signals: an HTTP title change reaches the live room (signals.py) ----
# A named session stays joined across steps; the PATCH below makes the room
# broadcast {"type":"title","title":...} to its members.
[[steps]]
ws = { action = "expect", session = "A", design_id = "{{capture:did}}", expect = "ready", expect_binary_kind = "sync/step1" }

[[steps]]
method = "PATCH"
path = "/api/v1/designs/{{capture:did}}/"
headers = { Content-Type = "application/json", X-CSRFToken = "{{cookie:csrftoken}}" }
body = '{"title":"Renamed Live"}'

[[steps]]
ws = { action = "expect", session = "A", design_id = "{{capture:did}}", expect = "title", close_code = 1000, close_reason = "bye" }

# ---- close codes (probe0012 phase B/C, probe0014) ----
# unknown text frame type -> 4400 bad_frame
[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", expect = "ready", expect_binary_kind = "sync/step1", send = '{"type":"bogus"}', expect_close_code = 4400, expect_close_reason = "bad_frame" }

# unknown binary message type -> 4400 bad_frame
[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", expect = "ready", expect_binary_kind = "sync/step1", send = "09", expect_close_code = 4400, expect_close_reason = "bad_frame" }

# a connection with no session cookie: accepted, then 4401 not_authenticated
[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", jar = "anon", expect_close_code = 4401, expect_close_reason = "not_authenticated" }

# a foreign Origin is refused at the handshake (HTTP 403, no upgrade)
[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", origin = "http://evil.example", expect_dial_status = 403 }

# ---- trashed design (probe0014 L6) ----
[[steps]]
method = "DELETE"
path = "/api/v1/designs/{{capture:did}}/"
headers = { X-CSRFToken = "{{cookie:csrftoken}}" }

[[steps]]
ws = { action = "expect", design_id = "{{capture:did}}", expect_close_code = 4404, expect_close_reason = "design_trashed" }
